[workspace]
resolver = "2"
members = ["crates/als-core", "crates/als-ext"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# 基座：Bevy 0.19（本地源码调试时用 [patch.crates-io] 指向本机 clone，路径经 gitignored 本地配置管理，勿提交）
bevy = "0.19"

# 基座插件 fork（M0.2 配置；upstream 与 fork 地址见 README.md，均为公开 git 依赖）
bevy_animation_graph = { git = "https://github.com/millionart/bevy_animation_graph", branch = "master" }
bevy-tnua = { git = "https://github.com/millionart/bevy-tnua", branch = "main" }
bevy-tnua-avian3d = { git = "https://github.com/millionart/bevy-tnua", branch = "main" }
avian3d = { version = "0.7", default-features = false, features = [
    "3d",
    "debug-plugin",
    "parallel",
] }

# 输入抽象（UE Enhanced Input 等价物）
bevy_enhanced_input = "0.26"

# 内部成员
als-core = { path = "crates/als-core" }
als-ext = { path = "crates/als-ext" }

serde = { version = "1.0", features = ["derive"] }
ron = "0.10"
thiserror = "2"

[package]
name = "bevy_als"
description = "ALS-Refactored style advanced locomotion system rebuilt with Bevy ECS"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = []

[dependencies]
bevy = { workspace = true }
bevy_animation_graph = { workspace = true }
als-core = { workspace = true }
als-ext = { workspace = true }

[dev-dependencies]
avian3d = { workspace = true }
bevy-tnua = { workspace = true }
bevy-tnua-avian3d = { workspace = true }
bevy_enhanced_input = { workspace = true }

[[bin]]
name = "bevy_als"
path = "src/main.rs"
