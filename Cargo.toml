[package]
name = "bevy_als"
description = "ALS-Refactored style advanced locomotion system rebuilt with Bevy ECS"
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/millionart/bevy_als"
resolver = "2"
autoexamples = false
autotests = false

[profile.dev.package."*"]
opt-level = 3

[profile.test]
# Keep the unit test unwind data within the Mach-O compact unwind range.
opt-level = 1

[dependencies]
bevy = { version = "0.20.1", features = ["tga"] }
bevy_animation_graph = { git = "https://github.com/millionart/bevy_animation_graph", rev = "ee8389b75069ccaea8f3d7f5a3db44c71413636b", features = ["physics_avian"] }
bevy_control_rig = { git = "https://github.com/millionart/bevy_control_rig", rev = "ccca1b0dc7e855a63c6654430b41d3bedc214d3a" }
bevy_gameplay_tag = { git = "https://github.com/millionart/bevy_gameplay_tag", rev = "30a41183ac0705e6b7b483d0a72f0ca70510327e" }
avian3d = { version = "0.8", default-features = false, features = ["3d", "debug-plugin", "parallel"] }
parry3d-f64 = { version = "0.31", default-features = false, features = ["alloc", "std", "required-features"] }
bevy-tnua = "0.33.2"
bevy-tnua-avian3d = "0.13.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1"
ron = "0.10"
bevy_gltf = "0.20.1"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[[test]]
name = "als_curves_data"
path = "src/tests/als_curves_data.rs"

[[test]]
name = "actor_movement_clock"
path = "src/tests/actor_movement_clock.rs"

[[test]]
name = "curve_import"
path = "src/tests/curve_import.rs"

[[test]]
name = "animgraph_assets"
path = "src/tests/animgraph_assets.rs"

[[test]]
name = "notify_event_tracks"
path = "src/tests/notify_event_tracks.rs"

[[test]]
name = "ragdoll_assets"
path = "src/tests/ragdoll_assets.rs"
