[package]
name = "bevy_als"
description = "ALS-Refactored style advanced locomotion system rebuilt with Bevy ECS"
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
resolver = "2"

[profile.dev.package."*"]
opt-level = 3

[profile.play]
inherits = "dev"
opt-level = 3
debug = 0
strip = "debuginfo"
incremental = false

[features]
default = []

[dependencies]
bevy = { version = "0.19", features = ["file_watcher", "tga", "pbr_clustered_decals"] }
bevy_animation_graph = { git = "https://github.com/millionart/bevy_animation_graph", branch = "master", features = ["physics_avian"] }
bevy_enhanced_input = "0.26"
bevy_gameplay_tag = { git = "https://github.com/SuitedRioter/bevy_gameplay_tag", rev = "1ed503fdd60de3456a96ecce7ade33f0a06bfde1" }
avian3d = { version = "0.7", default-features = false, features = ["3d", "debug-plugin", "parallel"] }
bevy-tnua = { git = "https://github.com/millionart/bevy-tnua", branch = "main" }
bevy-tnua-avian3d = { git = "https://github.com/millionart/bevy-tnua", branch = "main" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
ron = "0.10"
bevy_gltf = "0.19"

[dev-dependencies]
bevy_animation_graph_editor = { git = "https://github.com/millionart/bevy_animation_graph", branch = "master" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bin]]
name = "bevy_als"
path = "src/main.rs"

[[example]]
name = "manual_playground"
path = "src/als_extras/levels/manual_playground.rs"
